name: GridZero
options:
  bundleIdPrefix: win.gridzero
  deploymentTarget:
    iOS: '26.0'
packages:
  GridZeroCore:
    path: .
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-Osize'
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
targets:
  GridZero:
    type: application
    platform: iOS
    sources:
      - path: GridZero
    dependencies:
      - package: GridZeroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.gridzero.app
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GridZero
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: GridZero/Info.plist
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GridZeroModelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: GridZero
      - package: GridZeroCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GridZeroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GridZero
      - package: GridZeroCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GridZero
schemes:
  GridZero:
    build:
      targets:
        GridZero: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - GridZeroModelTests
        - GridZeroUITests
