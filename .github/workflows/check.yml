name: Check
on:
  push:
  pull_request:
jobs:
  core-and-site:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift engine
        run: swift test
      - name: Check static site
        run: python3 tools/check_site.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and build Kotlin app
        run: sh android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
