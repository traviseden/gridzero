name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-site:
    # Standard runners are free on public repositories. Never spend private-repo minutes.
    if: github.event.repository.private == false
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift engine
        run: swift test
  ios:
    if: github.event.repository.private == false
    timeout-minutes: 25
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'
      - name: Select iOS simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          available = [d for runtime, items in devices["devices"].items()
                       if "iOS-26-0" in runtime for d in items]
          phones = [d for d in available if d["name"].startswith("iPhone")]
          tablets = [d for d in available if d["name"].startswith("iPad Pro 13-inch")]
          if not phones or not tablets:
              raise SystemExit("iOS 26 iPhone and 13-inch iPad simulators are required")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'id={phones[0]["udid"]}\n')
              output.write(f'ipad={tablets[0]["udid"]}\n')
          PY
      - name: Build iOS Release
        run: xcodebuild -quiet -project GridZero.xcodeproj -scheme GridZero -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test iOS model, persistence, and UI
        run: xcodebuild -quiet -project GridZero.xcodeproj -scheme GridZero -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -resultBundlePath build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Test iPad accessibility, rotation, and resized windows
        run: xcodebuild -quiet -project GridZero.xcodeproj -scheme GridZero -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad }}' -parallel-testing-enabled NO -only-testing:GridZeroUITests/LayoutUITests -resultBundlePath build/ipad-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            build/ios-tests.xcresult
            build/ipad-tests.xcresult
  web:
    if: github.event.repository.private == false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python3 tools/check_site.py
      - run: python3 -m unittest discover -s tools/tests -v
      - run: npx playwright install --with-deps chromium webkit
        working-directory: site
      - run: npm run test:ui
        working-directory: site
  android:
    if: github.event.repository.private == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and build Kotlin app
        run: sh android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
